<!doctype html>
<meta charset="utf-8">
<title>engine fidelity page</title>
<style>html,body{margin:0;background:#fff}canvas{position:absolute;left:0;top:0;display:block}</style>
<script type="module">
// Renders one board through the Canvas engine at the origin, 1 world unit = 1 CSS px, so a screenshot of
// a region lines up pixel for pixel with the DOM reference. One engine for the page's lifetime (fonts stay
// registered across boards); big boards are shot in regions because a WebGPU canvas tops out at 8192 px.
// See engine/API.md.
import init, * as wasm from "/engine/pkg/canvas_engine.js";

let ready;
let exports;
window.engineReady = () => (ready ??= init().then((x) => { exports = x; return typeof wasm.Engine === "function"; }));

const j = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u + " -> " + r.status); return r.json(); };

let engine, canvas, current;
const fontsDone = new Set();
const bitmaps = new Map();

async function ensureEngine() {
  if (engine) return engine;
  canvas = document.createElement("canvas");
  canvas.style.width = "64px"; canvas.style.height = "64px";
  document.body.appendChild(canvas);
  engine = await wasm.Engine.create(canvas);
  engine.setBackground("#FFFFFF");
  // Text without fontSize / lineHeight inherits the host page's body font. The truth page copies the
  // Canvas page's body (13px / 1.45), which is also the engine's default.
  engine.setTextDefaults(13, 1.45);
  return engine;
}

window.loadBoard = async ({ file, id }) => {
  await window.engineReady();
  const e = await ensureEngine();
  const q = "file=" + encodeURIComponent(file) + "&id=" + encodeURIComponent(id);
  const scene = await j("/api/scene?" + q);
  for (const f of scene.fonts ?? []) {
    if (fontsDone.has(f.url)) continue;
    fontsDone.add(f.url);
    const r = await fetch(f.url);
    if (r.ok) e.registerFont(f.family, Number(r.headers.get("x-font-weight")) || 0, r.headers.get("x-font-style") || "", new Uint8Array(await r.arrayBuffer()));
  }
  if (current) e.removeBoard(current);
  current = id;
  const info = e.setBoard(id, 0, 0, JSON.stringify(scene));
  // The engine keeps the bitmap and decodes the resolution each draw needs, so it is not closed here.
  await Promise.all((scene.images ?? []).map(async (url) => {
    try {
      let bm = bitmaps.get(url);
      if (!bm) { bm = await createImageBitmap(await (await fetch(url)).blob()); bitmaps.set(url, bm); }
      e.registerImage(url, bm, bm.width, bm.height);
    } catch {}
  }));
  return info;
};

/** Draw the board region (x, y, w, h) in CSS px at `dpr` into the top-left of the page. */
window.showRegion = async (x, y, w, h, dpr) => {
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  engine.resize(w, h, dpr);
  engine.setCamera(-x, -y, 1);
  // frame() returns true while it still has tiles to draw or the camera is settling (150 ms).
  for (let i = 0; i < 900 && engine.frame(); i++) await new Promise((r) => requestAnimationFrame(r));
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return engine.stats();
};

window.setDilation = (factor, max) => engine.setTextDilation(factor, max);
window.memory = () => ({ wasm: exports?.memory?.buffer?.byteLength ?? null, stats: engine?.stats() });
</script>
