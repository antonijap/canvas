<!doctype html>
<html><head><meta charset="utf-8">
<!-- Release video layers, rendered by render-release.sh. Each release: rewrite the pill rows below from the
     release notes, then run the script with the version. ?layer=bg | head (&v=0.2.0) | r1..r4 (one row strip, the pill sequence repeated 3 times).
     ?layer=rN&measure=1 writes the width of one sequence into document.title. -->
<style>
  :root { --ink:#0B1B3A; --sub:#3F6DB8; --blue:#0A6CFF; --paper:#F7F9FC; }
  html,body { margin:0; background:transparent; overflow:hidden; }
  body { font-family:"SF Pro Display",-apple-system,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .page { position:relative; width:1920px; height:1080px; display:none; }
  #bg { background:
      linear-gradient(to right, rgba(63,109,184,.16) 1.5px, transparent 1.5px) 0 0/120px 120px,
      linear-gradient(to bottom, rgba(63,109,184,.16) 1.5px, transparent 1.5px) 0 0/120px 120px,
      linear-gradient(to right, rgba(63,109,184,.07) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(to bottom, rgba(63,109,184,.07) 1px, transparent 1px) 0 0/24px 24px,
      var(--paper); }
  .corner { position:absolute; width:44px; height:44px; border:0 solid #3F6DB8; opacity:.7; }
  .tl { left:40px; top:40px; border-left-width:2px; border-top-width:2px; }
  .tr { right:40px; top:40px; border-right-width:2px; border-top-width:2px; }
  .bl { left:40px; bottom:40px; border-left-width:2px; border-bottom-width:2px; }
  .br { right:40px; bottom:40px; border-right-width:2px; border-bottom-width:2px; }
  .mono { font-family:"JetBrainsMono Nerd Font",monospace; font-size:20px; letter-spacing:.22em; color:var(--sub); text-transform:uppercase; }
  #fig { position:absolute; left:120px; bottom:58px; }
  #url { position:absolute; right:120px; bottom:58px; }
  /* SF Pro tracking from Apple's chart: pt / size in em. 56 pt: +0.30 */
  #title { position:absolute; left:0; right:0; top:530px; margin:0; text-align:center; font-size:56px; font-weight:700; line-height:1; letter-spacing:.0054em; }
  #title span { color:var(--blue); }

  .strip { display:none; height:110px; align-items:center; padding-left:0; white-space:nowrap; }
  .seq { display:flex; gap:18px; padding-right:18px; }
  /* 30 pt: +0.40 */
  .pill { display:inline-flex; align-items:center; gap:14px; height:72px; padding:0 30px 0 22px; border-radius:999px;
          background:#fff; box-shadow:0 1px 2px rgba(11,27,58,.06), 0 8px 22px rgba(11,27,58,.08);
          font-size:30px; font-weight:500; letter-spacing:.0133em; }
  .pill svg { width:30px; height:30px; flex:none; }
  .key { display:inline-grid; place-items:center; min-width:34px; height:34px; padding:0 8px; border-radius:8px;
         background:#EEF2F8; box-shadow:inset 0 -2px 0 rgba(11,27,58,.12); font-size:20px; font-weight:600; letter-spacing:.0085em; }
</style></head>
<body>
<div id="bg" class="page">
</div>
<div id="head" class="page"><h1 id="title">Canvas <span>0.2.1</span></h1></div>
<script>
  const P = 'fill="none" stroke="#0A6CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const ic = {
    cloud:  `<svg viewBox="0 0 24 24" ${P}><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 10 4 4 0 0 0 7 18z"/></svg>`,
    mac:    `<svg viewBox="0 0 24 24" ${P}><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,
    link:   `<svg viewBox="0 0 24 24" ${P}><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>`,
    person: `<svg viewBox="0 0 24 24" ${P}><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>`,
    minus:  `<svg viewBox="0 0 24 24" ${P}><circle cx="9" cy="8" r="4"/><path d="M2 20c1.2-3.5 3.8-5 7-5s5.8 1.5 7 5M16 11h6"/></svg>`,
    cursor: `<svg viewBox="0 0 24 24" ${P}><path d="M5 3l14 7-6 2-2 6z"/></svg>`,
    select: `<svg viewBox="0 0 24 24" ${P}><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>`,
    move:   `<svg viewBox="0 0 24 24" ${P}><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>`,
    sync:   `<svg viewBox="0 0 24 24" ${P}><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M4 4v4h4M20 20v-4h-4"/></svg>`,
    spark:  `<svg viewBox="0 0 24 24" ${P}><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg>`,
    eye:    `<svg viewBox="0 0 24 24" ${P}><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
    undo:   `<svg viewBox="0 0 24 24" ${P}><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>`,
    text:   `<svg viewBox="0 0 24 24" ${P}><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>`,
    copy:   `<svg viewBox="0 0 24 24" ${P}><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>`,
    gauge:  `<svg viewBox="0 0 24 24" ${P}><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>`,
    file:   `<svg viewBox="0 0 24 24" ${P}><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/></svg>`,
    drop:   `<svg viewBox="0 0 24 24" ${P}><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>`,
    tab:    `<svg viewBox="0 0 24 24" ${P}><path d="M3 19V9a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7"/><path d="M2 19h20"/></svg>`,
    pen:    `<svg viewBox="0 0 24 24" ${P}><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>`,
    align:  `<svg viewBox="0 0 24 24" ${P}><path d="M4 3v18"/><rect x="7" y="6" width="12" height="4" rx="1"/><rect x="7" y="14" width="8" height="4" rx="1"/></svg>`,
    pin:    `<svg viewBox="0 0 24 24" ${P}><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-5 4v-4a2 2 0 0 1-2-2z"/></svg>`,
    list:   `<svg viewBox="0 0 24 24" ${P}><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>`,
    trash:  `<svg viewBox="0 0 24 24" ${P}><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,
  };
  const rows = {
    r1: [["list","New left sidebar"],["eye","Peeks in at the left edge"],["tab","Rounded top bar"],["pen","Floating drawing tools"],["file","Same sidebar on Home"]],
    r2: [["file","Sticky notes"],["spark","Stickers"],["pin","Dot votes"],["gauge","Timer"],["cloud","Votes and timer on Cloud"],["person","Viewers can comment and vote"]],
    r3: [["pin","Dictate comments"],["text",'Hold <span class="key">fn</span> to talk'],["select","See where a comment will attach"],["spark","Agent conversations list"]],
    r4: [["cloud","Sign in from a Cloud page"],["gauge","Screenshot-heavy files open faster"],["cursor","Right-click menu fixes"],["sync","Hosted Cloud fixes"]],
  };
  const q = new URLSearchParams(location.search);
  const layer = q.get("layer") || "bg";
  if (q.get("v")) document.querySelector("#title span").textContent = q.get("v");
  if (rows[layer]) {
    const s = document.createElement("div");
    s.className = "strip"; s.style.display = "flex";
    const seq = '<div class="seq">' + rows[layer].map(([i, t]) => `<span class="pill">${ic[i]}<span>${t}</span></span>`).join("") + "</div>";
    s.innerHTML = seq + seq + seq;
    document.body.appendChild(s);
    if (q.get("measure")) document.title = "W=" + Math.round(s.firstChild.getBoundingClientRect().width);
  } else {
    document.getElementById(layer).style.display = "block";
  }
</script>
</body></html>
