[package]
name = "canvas-engine"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vello = { version = "=0.11.0", default-features = false, features = ["wgpu"] }
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "wgsl", "webgpu"] }
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
taffy = "=0.15.1"
peniko = "=0.6.1"
kurbo = "=0.13.1"
skrifa = "=0.44.0"
bytemuck = { version = "=1.25.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["console", "Window", "Document", "HtmlCanvasElement", "HtmlVideoElement", "HtmlMediaElement", "VideoFrame", "Element", "Performance", "ImageBitmap", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
