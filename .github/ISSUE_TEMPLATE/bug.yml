name: Bug
description: Something in Canvas does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps. Attach a .canvas file only if it holds nothing private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Canvas commit and macOS version
    validations:
      required: true
