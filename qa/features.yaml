    cases: [$layers, $cards, mouse]
  - id: resize-text-growth
    name: A side edge makes text auto height, a top edge fixed size
    area: resize
    driven: [page]
    cases: [text, mouse]
  - id: resize-keys
    name: Cmd+arrows resize width and height
    area: resize
    driven: [page]
    cases: [$layers, keyboard, rotated, in-autolayout, in-frame, nested]
  - id: group-box
    name: A group's box covers its layers, rotated ones too
    area: resize
    driven: [page]
    cases: [group, rotated, nested]
  - id: rotate
    name: Rotate from outside a corner, about the centre or the origin Option+R shows
    area: resize
    driven: [page, mcp]
    cases: [$layers, rotated, nested, mouse, agent, in-autolayout, in-frame, keyboard, origin]
  - id: comments
    name: C pins a comment thread to the layer under the pointer
    area: comments
    driven: [page, mcp]
    cases: [pin, page-point, follows-layer, move, add-pin, reply, resolve, show-resolved, list-navigation, unread, pin-menu, layer-deleted, reopen, keyboard, light, dark, shared-bar, pending, rejected, alignment, toolbar-popovers]
  - id: scale-tool
    name: K scales a layer with its contents
    area: resize
    driven: [page, mcp]
    cases: [frame, group, text, keyboard, agent]
  - id: fit-board
    name: Opt+Cmd+Shift+R resizes a board to fit its content
    area: resize
    driven: [page]
    cases: [board, keyboard]

  # ------------------------------------------------------------ properties
  - id: opacity-keys
    name: Digits set opacity (1 is 10%, 0 is 100%, two quick digits a percentage)
    area: properties
    driven: [page]
    cases: [$layers, many, keyboard, rotated, in-autolayout, in-frame, nested]
  - id: flip
    name: Shift+H / Shift+V flip
    area: properties
    driven: [page]
    cases: [$layers, rotated, keyboard, in-autolayout, in-frame, nested]
  - id: hide-show
    name: Shift+Cmd+H hides and shows the selection
    area: properties
    driven: [page, native]
