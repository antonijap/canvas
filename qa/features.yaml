    area: properties
    driven: [page, native]
    cases: [text, keyboard, mouse, many]
  - id: text-multi-edit
    name: Several text layers selected, Return, type, all of them change (multi-edit)
    area: properties
    driven: [page]
    cases: [text, many, keyboard]
