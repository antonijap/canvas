# The feature catalog: every Canvas feature and the cases it must survive (docs/qa-plan.md section 1).
#
# A scenario says what it tests with covers: ["feature-id:case", ...] (qa/scenarios.ts, qa/matrix.ts), and
# pnpm qa:coverage prints which feature x case pairs have a test and which do not.
#
# Each feature: id, name, area, driven (how a test drives it: page = the web page with real mouse and keys in
# headless Chrome, native = the macOS shell's SwiftUI or AppKit parts, mcp = Canvas MCP tools or the HTTP API they
# use) and cases. A case is one value on one dimension below (a node type, a state, a theme, a file size, an input),
# or a case of the feature's own (a handle, a tool name, a key). $name expands one of the sets.
#
# Derived from docs/developer-guide.md (shortcuts, tools, variations, agent cursor, settings), README.md, the
# inspector sections (apps/macos/Inspector*.swift), the widget kinds (src/widgets/kinds) and the MCP tool list
# (mcp/tools/*.ts).

dimensions:
  node: [rectangle, ellipse, frame, group, text, image, instance, board, component, card-todo, card-note, card-posthog, card-shader, card-video]
  state: [empty, one, many, rotated, in-instance, in-autolayout, hidden, other-page, nested, in-frame, cross-board]
  theme: [light, dark]
  size: [tiny, large, 5000-boards]
  input: [mouse, keyboard, agent]

sets:
  layers: [rectangle, ellipse, frame, group, text, image, instance]
  cards: [card-todo, card-note, card-posthog, card-shader, card-video]
  states: [one, many, rotated, in-instance, in-autolayout, hidden, other-page, nested]
  themes: [light, dark]
  sizes: [tiny, large, 5000-boards]
  handles: [handle-n, handle-s, handle-e, handle-w, handle-ne, handle-nw, handle-se, handle-sw]

features:
  # ------------------------------------------------------------ canvas and render
  - id: blueprint
    name: Blueprint page background
    area: canvas
    driven: [page, native, mcp]
    cases: [snap, persistence, zoom, inspector, undo]

  - id: sticky
    name: Sticky note placement, editing and quick add
    area: canvas
    driven: [page, native, mcp]
    cases: [create, resize, edit, style, next, author, undo, cloud, handles, author-removal, compact-controls, ghost-clearance]

  - id: sticker
    name: Anchored stickers and stacked seals
    area: canvas
    driven: [page, native, mcp]
    cases: [place, stack, anchor, author, cloud, dom-anchor, strip-layout, ghost-clearance]

  - id: vote
    name: Whiteboard voting
    area: canvas
    driven: [page, native, mcp]
    cases: [start, scope, ballot, persistence, privacy, results, undo, clear, portable, palette, compact-panels, cloud, cloud-privacy, cloud-viewer, cloud-private-presence, cloud-cache, cloud-design, cloud-legacy-retry]

  - id: timer
    name: Whiteboard countdowns
    area: canvas
    driven: [page, native]
    cases: [standalone, controls, compact, cloud, expiry, clock-change]

  - id: draw
    name: Draw boards and layers
    area: canvas
    driven: [page, native]
    cases: [board, rectangle, ellipse, text, cancel, tool-palette, shortcuts, hide-ui, menu, palette, compact-tooltip]

  - id: render
    name: Every node type draws on the engine renderer
    area: canvas
    driven: [page]
    cases: [$layers, icon, board, component, $cards, rotated, nested, hidden, $themes, $sizes, open-cache]
  - id: icons
    name: Phosphor and Material Symbols draw locally in the canvas and exports
    area: icons
    driven: [page, native]
    cases: [offline, app]
  - id: pan-zoom
    name: Pan (Space drag, scroll, arrows with nothing selected) and zoom (Cmd scroll, pinch, Cmd +/-, Shift +/-, Z tool, typed in the zoom pill)
    area: canvas
    driven: [page, native]
    cases: [mouse, keyboard, tiny, large, 5000-boards, shift-keys, arrows, zoom-tool, typed, buttons]
  - id: pixel-grid
    name: The pixel grid from 400% up, Cmd+' (View > Pixel Grid) toggles it
    area: canvas
    driven: [page, native]
    cases: [keyboard, menu, zoom-below, zoom-above]
  - id: rulers
    name: Rulers (Shift+R, View > Rulers); guides dragged out of them onto a board, saved on the board, moved and removed
    area: canvas
    driven: [page, native]
    cases: [keyboard, menu, add, move, remove, undo]
  - id: layout-guides
    name: Layout guides (grid, columns, rows) per frame, Control+G and View > Layout Guides, snapping to them, inspector Layout guide section
    area: canvas
    driven: [page, native]
    cases: [keyboard, menu, columns, rows, grid, snap-move, snap-resize, inspector]
  - id: fit
    name: Shift+1 fit page, Shift+2 fit selection, Shift+0 100%
    area: canvas
    driven: [page]
    cases: [empty, one, many, other-page, keyboard]
  - id: board-labels
    name: Board name labels (only top-level frames carry one)
    area: canvas
    driven: [page]
    cases: [board, instance, text, many, $themes]
  - id: renderer-fallback
    name: DOM renderer when WebGPU is missing; a new engine after one traps, never stuck pending
    area: canvas
    driven: [page]
    cases: [tiny, large, engine-restart, gpu-fence, scene-reload, scene-stream]

  # ------------------------------------------------------------ selection
  - id: select-click
    name: Click selects the board child, double-click goes one level in
    area: select
    driven: [page]
    cases: [$layers, nested, in-frame, in-instance, in-autolayout, rotated, mouse]
  - id: select-layer
    name: Right-click > Select layer lists every layer under the pointer, topmost first; picking one selects it
    area: select
    driven: [page, native]
    cases: [nested, overlap, menu]
  - id: select-deep
    name: Cmd+click selects the deepest layer
    area: select
    driven: [page]
    cases: [nested, in-frame, in-instance, mouse]
  - id: select-add
    name: Shift+click adds to the selection
    area: select
    driven: [page]
    cases: [many, cross-board, mouse]
  - id: marquee
    name: Marquee and deep marquee (Cmd)
    area: select
    driven: [page]
    cases: [empty, many, board, nested, cross-board]
  - id: select-keys
    name: Enter/Shift+Enter children/parent, Tab siblings, N boards, Esc, Cmd+A
    area: select
    driven: [page]
    cases: [one, nested, board, keyboard, backslash]
  - id: lock
    name: Shift+Cmd+L and the Layers padlock lock layers; locked ones ignore canvas clicks and the marquee, a locked frame locks its children
    area: select
    driven: [page, native, mcp]
    cases: [rectangle, frame, board, nested, many, keyboard, mouse, agent, lock-drag, canvas-keys]
  - id: select-matching
    name: Option+Cmd+A selects same-named layers in the other boards
    area: select
    driven: [page]
    cases: [cross-board, keyboard, empty]
  - id: select-same
    name: Edit > Select All with Same fill, stroke, effect, text properties, font, instances
    area: select
    driven: [page]
    cases: [stroke, effect, many]
  - id: select-inverse
    name: Shift+Cmd+A selects everything in the selection's scope except it
    area: select
    driven: [page]
    cases: [one, board, keyboard]
  - id: keyboard-select
    name: Option+Space keyboard cursor; arrows move it, Return picks, Cmd+arrows draw a selection box
    area: select
    driven: [page]
    cases: [one, many, keyboard]

  # ------------------------------------------------------------ move
  - id: move
    name: Drag moves the selection, one undo step
    area: move
    driven: [page, mcp]
    cases: [$layers, $cards, board, one, many, rotated, in-frame, nested, in-instance, cross-board, mouse, agent]
  - id: move-axis-lock
    name: Shift locks a drag to one axis
    area: move
    driven: [page]
    cases: [one, mouse]
  - id: move-reparent
    name: Drag into a frame and back out
    area: move
    driven: [page, mcp]
    cases: [one, in-frame, in-autolayout, mouse, agent]
  - id: move-keep-parent
    name: Space held while dragging keeps a layer in its parent (no leaving its frame, no nesting)
    area: move
    driven: [page]
    cases: [one, many, in-frame, in-autolayout, board, mouse]
  - id: option-drag-duplicate
    name: Option-drag copies, the original stays
    area: move
    driven: [page, native]
    cases: [one, many, rectangle, mouse]
  - id: nudge
    name: Arrows nudge 1 px, Shift+arrows big nudge
    area: move
    driven: [page]
    cases: [$layers, many, in-autolayout, keyboard, rotated, in-frame, nested]
  - id: snapping
    name: Snap to objects, pixel grid, smart guides; Control bypasses
    area: move
    driven: [page]
    cases: [one, many, mouse, ctrl]

  # ------------------------------------------------------------ resize, rotate, scale
  - id: resize
