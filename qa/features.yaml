    cases: [rectangle, many, keyboard]
  - id: paint-keys
    name: Option+/ removes fills, Shift+/ strokes, Shift+X swaps them; Shift+Up/Down in a hex field
    area: properties
    driven: [page, native]
    cases: [rectangle, many, instance, keyboard]
  - id: copy-paint
    name: Copy one paint, a right-click Copy Fill / Paste Fill or a picked row with Cmd+C / Cmd+V, onto another layer
    area: properties
    driven: [native]
    cases: [rectangle, ellipse, mouse, keyboard, stroke, effect]
  - id: contrast-check
    name: The colour picker rates a text colour against what is behind it (WCAG ratio, APCA Lc)
    area: properties
    driven: [native]
    cases: [text, mouse]
  - id: use-as-mask
    name: Control+Cmd+M makes a layer a mask for the layers above it
    area: properties
