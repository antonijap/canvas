    cases: [$layers, many, in-instance, $themes, agent, rotated, in-autolayout, in-frame, nested]
  - id: corner-radius-knob
    name: Corner knobs drag the radius (Option one corner)
    area: properties
    driven: [page]
    cases: [rectangle, frame, mouse]
  - id: smart-selection
