  - id: text-style-keys
    name: Cmd+B/I/U, Shift+Cmd+X, font size and text align keys
    area: properties
    driven: [page]
    cases: [text, many, keyboard]
  - id: copy-paste-props
    name: Opt+Cmd+C / Opt+Cmd+V copy and paste properties
    area: properties
    driven: [page]
    cases: [$layers, keyboard]
  - id: repeat
    name: . repeats the last property edit
    area: properties
    driven: [page, native]
    cases: [one, many, keyboard]
  - id: variables
    name: Colour and number variables, light and dark themes
    area: properties
    driven: [page, native]
    cases: [rectangle, frame, text, $themes]
  - id: text-edit
    name: Double-click edits a text layer; typing, selection, Escape commits
    area: properties
    driven: [page]
