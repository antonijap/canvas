    area: structure
    driven: [page, mcp]
    cases: [image, card-video, other-app, other-file]
  - id: reorder
    name: Cmd+] / Cmd+[ and Option for front and back
    area: structure
    driven: [page, mcp]
    cases: [$layers, keyboard, agent]

  # ------------------------------------------------------------ auto layout
  - id: autolayout-toggle
